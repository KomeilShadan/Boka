spring:
  profiles:
    group:
      local: demo
  application:
    name: boka
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 5000
      connection-init-sql: "SET lock_timeout = '5s'; SET statement_timeout = '10s'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    connect-retries: 10
server:
  port: 8080
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
